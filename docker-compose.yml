services:
  prayer:
    build: .
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: .env
    networks:
      - rag_default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      # ⚠️ Router/service names MUST be `prayer.*` — a duplicate name on the
      # shared Traefik silently breaks routing for sibling apps (e.g. home.*).
      - traefik.enable=true
      - traefik.http.routers.prayer.rule=Host(`prayer.altijwal.com`)
      - traefik.http.routers.prayer.tls=true
      - traefik.http.routers.prayer.entrypoints=web,websecure
      - traefik.http.services.prayer.loadbalancer.server.port=8000
      # ── Origin lockdown: only Cloudflare may reach this router (2026-07-26) ──
      # The app trusts cf-connecting-ip / x-forwarded-for to identify a client
      # (admin login throttle, Places per-client quotas). Anyone reaching the
      # origin IP directly could forge those headers and dodge both. Traefik has
      # no forwardedHeaders.trustedIPs and no proxyProtocol, so ipAllowList here
      # matches the real TCP peer — i.e. the Cloudflare edge — and closes that.
      #
      # Deliberately scoped to the `prayer` ROUTER via this app's own labels, NOT
      # to the shared :443 entrypoint: the same Traefik fronts n8n and the home
      # dashboard, and an entrypoint-level rule would silently cover them too.
      #
      # Ranges are Cloudflare's published list (cloudflare.com/ips-v4 + ips-v6),
      # fetched 2026-07-26. Cloudflare adds ranges rarely; if the site ever 403s
      # for everyone, re-check that list first. To roll back, drop the two labels
      # below and run `docker compose up -d`.
      - traefik.http.middlewares.prayer-cfonly.ipallowlist.sourcerange=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      - traefik.http.routers.prayer.middlewares=prayer-cfonly

networks:
  rag_default:
    external: true
