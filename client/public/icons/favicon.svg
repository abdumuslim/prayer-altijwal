<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#0a2c2a"/>
      <stop offset="1" stop-color="#04181a"/>
    </linearGradient>
    <linearGradient id="dome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#fbe3a1"/>
      <stop offset="1" stop-color="#f5c451"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Crescent + star (gold) -->
  <path d="M 372 96 A 76 76 0 1 0 372 232 A 60 60 0 1 1 372 96 Z" fill="url(#gold)"/>
  <path d="M 250 120 l 12 26 28 3 -21 19 6 28 -25 -14 -25 14 6 -28 -21 -19 28 -3 Z" fill="url(#gold)"/>

  <!-- Central mosque dome -->
  <path d="M 256 196
           C 212 196 184 232 184 272
           L 184 360
           L 328 360
           L 328 272
           C 328 232 300 196 256 196 Z"
        fill="url(#dome)"/>
  <!-- finial -->
  <circle cx="256" cy="184" r="11" fill="url(#gold)"/>
  <rect x="251" y="160" width="10" height="28" rx="5" fill="url(#gold)"/>

  <!-- Side minarets -->
  <rect x="150" y="248" width="22" height="112" rx="11" fill="url(#dome)"/>
  <circle cx="161" cy="240" r="14" fill="url(#dome)"/>
  <rect x="340" y="248" width="22" height="112" rx="11" fill="url(#dome)"/>
  <circle cx="351" cy="240" r="14" fill="url(#dome)"/>

  <!-- Arched doorway -->
  <path d="M 256 300 C 238 300 226 314 226 332 L 226 360 L 286 360 L 286 332 C 286 314 274 300 256 300 Z" fill="#04181a"/>

  <!-- Base platform -->
  <rect x="138" y="360" width="236" height="22" rx="11" fill="url(#gold)"/>
</svg>
