<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06231f" />
    <script>
      // Pre-paint theme boot (docs/V2_REDESIGN_SPEC.md Phase 1): stamp the
      // persisted theme + font scale on <html> before CSS paints so a cold
      // start never flashes the default theme. Keep the valid-id list in sync
      // with lib/theme.ts THEMES.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("prayer.app.v1") || "{}") || {};
          var valid = { night: 1, glass: 1, material: 1, contrast: 1 };
          document.documentElement.dataset.theme = valid[s.theme] ? s.theme : "night";
          if (s.fontScale === 1.125 || s.fontScale === 1.25)
            document.documentElement.dataset.fontScale = String(s.fontScale);
        } catch (e) {
          document.documentElement.dataset.theme = "night";
        }
      })();
    </script>
    <meta name="description" content="أوقات الصلاة بدقة حسب موقعك — Accurate GPS-based Islamic prayer times with live countdown." />
    <title>أوقات الصلاة | Prayer Times</title>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="أوقات الصلاة" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Liquid-Glass edge-lensing filter defs (docs/V2_REDESIGN_SPEC.md Phase 7).
         Referenced ONLY by the glass theme as backdrop-filter: url(#…) behind the
         html[data-lens] Chromium gate (main.tsx) — zero cost for other themes.
         Maps are generated by client/scripts/build-glass-lens.mjs (R=X, G=Y,
         128=neutral); scale values are the script's printed per-map maxima. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="glass-lens-bar" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox">
        <feImage href="/glass-lens-bar.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="0.05" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="glass-lens-card" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox">
        <feImage href="/glass-lens-card.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="0.04" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
